services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    # Сайт стартует только когда MySQL готов принимать подключения
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMIN_PASSWORD_HASH_B64: "JDJ5JDEwJGNDTzlqYnNmbEk1V2hMcFd1NGEuamV3WlpSNXU1VHVxdWpXc09TNnZKUE00aGR3bHpzN3p1"

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./lada.sql:/docker-entrypoint-initdb.d/lada.sql
    # При первом запуске MySQL сначала загружает lada.sql во временный сервер без сети,
    # поэтому проверяем подключение по TCP, а не через сокет
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uuser", "-ppassword"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  db_data:
