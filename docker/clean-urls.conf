# Адреса без расширения .php: /edit вместо /edit.php
<Directory /var/www/html/public>
    # Не показывать список файлов в папках без index
    Options -Indexes

    RewriteEngine On

    # Старые ссылки вида /page.php перенаправляем на /page.
    # Только GET: редирект POST-запроса потерял бы тело формы или JSON.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteCond %{THE_REQUEST} \s/+([^?\s]*/)?index\.php[\s?]
    RewriteRule ^ /%1 [R=301,L]

    RewriteCond %{REQUEST_METHOD} =GET
    RewriteCond %{THE_REQUEST} \s/+([^?\s]+?)\.php[\s?]
    RewriteRule ^ /%1 [R=301,L]

    # /page отдаём скриптом page.php, если такой файл есть
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME}.php -f
    RewriteRule ^(.+)$ $1.php [L]
</Directory>
